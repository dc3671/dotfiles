# Status widgets (tmux/sysstat.sh: CPU, mem, default-route NIC rate), gated by
# tmux/extras-enabled.sh. status-right here is .tmux.conf's with the widget before %a.
set -g status-right "#[fg=#2f323e,bg=#2f323e,nobold,nounderscore,noitalics] #(~/dotfiles/tmux/sysstat.sh) #[fg=#404455,bg=#2f323e,nobold,nounderscore,noitalics]#[fg=#c5cdd9,bg=#404455] %a #[fg=#ffcc00,bg=#404455,nobold,nounderscore,noitalics]#[fg=#2b2d37,bg=#ffcc00] %R "
