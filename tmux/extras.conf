# Optional status widgets; gated by tmux/extras-enabled.sh, fetched by
# `install.sh --tmux-extras`. The plugins rewrite #{...} in status-left at load.
set -g @sysstat_cpu_view_tmpl '#[fg=#c5cdd9]C:#[default] #[fg=#{cpu.color}]#{cpu.pused}#[default]'
set -g @sysstat_mem_view_tmpl '#[fg=#c5cdd9]M:#[default] #[fg=#{mem.color}]#{mem.pused}#[default]'
set -ga status-left " #{sysstat_cpu} #{sysstat_mem} #[fg=#c5cdd9]#{net_speed} "
run-shell '~/.tmux/plugins/tmux-plugin-sysstat/sysstat.tmux'
run-shell '~/.tmux/plugins/tmux-net-speed/net_speed.tmux'
