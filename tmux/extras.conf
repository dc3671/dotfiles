# Optional status widgets; gated by tmux/extras-enabled.sh, fetched by
# `install.sh --tmux-extras`. The plugins rewrite #{...} in status-right at load;
# status-right here is .tmux.conf's with the widgets before %a (layout of 33accae).
set -g @sysstat_cpu_view_tmpl '#[fg=#c5cdd9]C:#[default] #[fg=#{cpu.color}]#{cpu.pused}#[default]'
set -g @sysstat_mem_view_tmpl '#[fg=#c5cdd9]M:#[default] #[fg=#{mem.color}]#{mem.pused}#[default]'
set -g status-right "#[fg=#2f323e,bg=#2f323e,nobold,nounderscore,noitalics] #[fg=#c5cdd9] 祝#{upload_speed} #[fg=#c5cdd9]  #{download_speed} #{sysstat_cpu} #[fg=#c5cdd9,bg=#2f323e] #{sysstat_mem} #[fg=#404455,bg=#2f323e,nobold,nounderscore,noitalics]#[fg=#c5cdd9,bg=#404455] %a #[fg=#ffcc00,bg=#404455,nobold,nounderscore,noitalics]#[fg=#2b2d37,bg=#ffcc00] %R "
run-shell '~/.tmux/plugins/tmux-plugin-sysstat/sysstat.tmux'
run-shell '~/.tmux/plugins/tmux-net-speed/net_speed.tmux'
